# Journal registry for the Crossref collector.
#
# Every ISSN below was checked against the Crossref API (api.crossref.org/journals/<issn>)
# on 2026-10-09; `crossref_title` is the title Crossref returned. The collector queries
# Crossref by every listed ISSN, so print and electronic ISSNs are both kept.
#
# tier 1: screened every run. tier 2: screened, but lower prior priority.
# fields: economics | business (UTD 24) | statistics | science

