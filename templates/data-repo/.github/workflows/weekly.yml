name: weekly
on:
  schedule:
    - cron: "0 13 * * 0"    # Sunday ~8:00 CDT
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: lark-state
  cancel-in-progress: false
jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LARK_DATA_DIR: ${{ github.workspace }}
      LARK_CONTACT_EMAIL: ${{ vars.LARK_CONTACT_EMAIL }}
      LARK_SMTP_USER: ${{ secrets.LARK_SMTP_USER }}
      LARK_SMTP_PASSWORD: ${{ secrets.LARK_SMTP_PASSWORD }}
      LARK_EMAIL_TO: ${{ secrets.LARK_EMAIL_TO }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-lark
        with:
          codex-auth: ${{ secrets.CODEX_AUTH_JSON }}
      - name: Run weekly synthesis
        run: |
          unset ANTHROPIC_API_KEY
          lark weekly --data-dir .
      - if: always()
        uses: ./.github/actions/save-state
        with:
          message: "lark: weekly run ${{ github.run_id }}"
          admin-token: ${{ secrets.LARK_ADMIN_TOKEN }}
