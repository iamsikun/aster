name: daily
on:
  schedule:
    - cron: "15 11 * * *"   # ~6:15 CDT / 5:15 CST; GitHub often starts scheduled runs late
  workflow_dispatch:
    inputs:
      dry_run:
        description: Write the email to out/ instead of sending it
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
concurrency:
  group: lark-state
  cancel-in-progress: false
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      grobid:
        image: grobid/grobid:0.9.1-crf
        ports: ["8070:8070"]
    env:
      LARK_DATA_DIR: ${{ github.workspace }}
      LARK_GROBID_URL: http://localhost:8070
      LARK_CONTACT_EMAIL: ${{ vars.LARK_CONTACT_EMAIL }}
      LARK_SMTP_USER: ${{ secrets.LARK_SMTP_USER }}
      LARK_SMTP_PASSWORD: ${{ secrets.LARK_SMTP_PASSWORD }}
      LARK_EMAIL_TO: ${{ secrets.LARK_EMAIL_TO }}
      LARK_IMAP_USER: ${{ secrets.LARK_IMAP_USER }}
      LARK_IMAP_PASSWORD: ${{ secrets.LARK_IMAP_PASSWORD }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-lark
        with:
          codex-auth: ${{ secrets.CODEX_AUTH_JSON }}
      - name: Run daily pipeline
        env:
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          unset ANTHROPIC_API_KEY   # would override the subscription token in claude -p
          lark daily --data-dir . $DRY_RUN
      - if: always()
        uses: ./.github/actions/save-state
        with:
          message: "lark: daily run ${{ github.run_id }}"
          admin-token: ${{ secrets.LARK_ADMIN_TOKEN }}
