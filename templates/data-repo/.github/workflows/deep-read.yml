name: deep-read
on:
  workflow_dispatch:
    inputs:
      target:
        description: Paper URL, DOI, arXiv id, or Lark work_id
        required: true
        type: string
permissions:
  contents: write
  issues: write
concurrency:
  group: lark-state
  cancel-in-progress: false
jobs:
  deep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      grobid:
        image: grobid/grobid:0.9.1-crf
        ports: ["8070:8070"]
    env:
      LARK_DATA_DIR: ${{ github.workspace }}
      LARK_GROBID_URL: http://localhost:8070
      LARK_CONTACT_EMAIL: ${{ vars.LARK_CONTACT_EMAIL }}
      LARK_SMTP_USER: ${{ secrets.LARK_SMTP_USER }}
      LARK_SMTP_PASSWORD: ${{ secrets.LARK_SMTP_PASSWORD }}
      LARK_EMAIL_TO: ${{ secrets.LARK_EMAIL_TO }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-lark
        with:
          codex-auth: ${{ secrets.CODEX_AUTH_JSON }}
      - name: Deep read
        env:
          TARGET: ${{ inputs.target }}   # passed via env, never interpolated into the script
        run: |
          unset ANTHROPIC_API_KEY
          lark deep "$TARGET" --data-dir .
      - if: always()
        uses: ./.github/actions/save-state
        with:
          message: "lark: deep read ${{ github.run_id }}"
          admin-token: ${{ secrets.LARK_ADMIN_TOKEN }}
