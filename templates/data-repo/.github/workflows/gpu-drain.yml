name: gpu-drain
# Runs on the RTX 4090 workstation (self-hosted runner, label `gpu`) whenever it is online.
# Drains backlog jobs tagged `gpu`: extra screening, audit reads, Docling parsing, embedding
# backfills, local-reader comparisons. The daily briefing never waits for this workflow.
#
# It uses its own concurrency group: a run waiting for an offline runner must not block the
# daily workflow. Its state files carry the `gpu` writer suffix (LARK_WRITER), so its commits
# never conflict with the hosted runs and a rebase before push is always clean.
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lark-gpu
  cancel-in-progress: false
jobs:
  drain:
    runs-on: [self-hosted, gpu]
    timeout-minutes: 110
    env:
      LARK_DATA_DIR: ${{ github.workspace }}
      LARK_WRITER: gpu
      LARK_LOCAL_LLM_URL: http://localhost:11434/v1
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-lark
        with:
          extras: embed,docling
          install-clis: "false"
      - name: Ensure Ollama is serving
        run: |
          if ! curl -sf http://localhost:11434/api/tags > /dev/null; then
            (nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &)
            for i in $(seq 1 30); do curl -sf http://localhost:11434/api/tags > /dev/null && break; sleep 2; done
          fi
          curl -sf http://localhost:11434/api/tags > /dev/null || { echo "Ollama not reachable" >&2; exit 1; }
      - name: Drain GPU jobs
        run: lark drain --tag gpu --data-dir . --max-minutes 100
      - if: always()
        uses: ./.github/actions/save-state
        with:
          message: "lark: gpu drain ${{ github.run_id }}"
