name: Set up Lark
description: Install Lark and the model CLIs, and restore subscription credentials.
inputs:
  extras:
    description: Python extras for the lark install
    default: embed
  lark-ref:
    description: Git ref of iamsikun/lark to install
    default: main
  codex-auth:
    description: Contents of ~/.codex/auth.json (secret CODEX_AUTH_JSON)
    default: ""
  install-clis:
    description: Install the claude and codex CLIs
    default: "true"
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v6
    - uses: actions/setup-node@v4
      if: inputs.install-clis == 'true'
      with:
        node-version: "22"
    - name: Cache embedding model
      uses: actions/cache@v4
      with:
        path: ~/.cache/fastembed
        key: fastembed-bge-small-en-v1.5
    - name: Point fastembed at the cache
      shell: bash
      run: echo "FASTEMBED_CACHE_PATH=$HOME/.cache/fastembed" >> "$GITHUB_ENV"
    - name: Install Lark
      shell: bash
      run: uv tool install --python 3.12 "lark[${{ inputs.extras }}] @ git+https://github.com/iamsikun/lark@${{ inputs.lark-ref }}"
    - name: Install model CLIs
      if: inputs.install-clis == 'true'
      shell: bash
      run: npm install -g --silent @anthropic-ai/claude-code @openai/codex
    - name: Restore Codex credentials
      if: inputs.codex-auth != ''
      shell: bash
      env:
        CODEX_AUTH_JSON: ${{ inputs.codex-auth }}
      run: |
        mkdir -p ~/.codex
        umask 077
        printf '%s' "$CODEX_AUTH_JSON" > ~/.codex/auth.json
        chmod 600 ~/.codex/auth.json
        sha256sum ~/.codex/auth.json | cut -d' ' -f1 > "$RUNNER_TEMP/codex-auth.sha"
