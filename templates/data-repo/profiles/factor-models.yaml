id: factor-models
name: Factor models and downstream financial tasks
bucket: active
priority: medium
description: >
  Statistical and machine-learned factor models in asset pricing and how factor
  estimates feed downstream tasks: risk models, covariance estimation, asset
  allocation, and security selection.
questions:
  - How do estimation errors in statistical or latent factors propagate into portfolio weights, risk forecasts, and selection decisions?
  - When do machine-learned or text-based factors improve downstream allocation once estimation uncertainty is accounted for?
  - How should factor models be evaluated by downstream decision quality rather than fit alone?
keywords:
  - latent factor model
  - principal component analysis asset pricing
  - instrumented PCA
  - statistical factors
  - risk model
  - covariance estimation
  - shrinkage covariance
  - portfolio optimization
  - asset allocation
  - security selection
  - anomaly zoo
  - factor zoo
  - stochastic discount factor
  - high-dimensional factor models
recognize:
  - estimation uncertainty in mean-variance optimization and its corrections
  - multiple-testing / data-snooping corrections for factor discovery (links to selection-inference)
  - embeddings or LLM text features used as characteristics in cross-sectional return models
  - weak factors and inference with many assets
