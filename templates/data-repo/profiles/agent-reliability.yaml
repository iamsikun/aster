id: agent-reliability
name: Agent reliability
bucket: active
priority: medium
description: >
  Reliability of AI agents that act on decisions: execution errors, noncompliance
  with instructions or policies, verification of agent outputs, and learning policies
  when implementation is imperfect.
questions:
  - How should we model and estimate the gap between the policy an agent is instructed to follow and the actions it actually executes?
  - How can a decision maker learn or evaluate a policy when its implementation by an agent is noisy or noncompliant?
  - Which verification strategies give statistical guarantees about agent behaviour at acceptable cost?
keywords:
  - agent reliability
  - execution error
  - noncompliance
  - instruction following
  - verification
  - LLM agents
  - tool use errors
  - agent evaluation
  - principal-agent
  - imperfect implementation
  - policy learning with noncompliance
  - human-AI delegation
  - selective prediction
  - abstention
recognize:
  - instrumental-variable or encouragement-design views of agent compliance
  - statistical auditing / sampling plans for verifying automated outputs
  - benchmarks measuring agent task completion with failure taxonomies
  - delegation and contracting models applied to AI systems
seeds: []      # TODO
negatives: []  # TODO: e.g. agent papers reporting leaderboard gains without any reliability analysis
known: []      # TODO
watch: {authors: [], labs: [], venues: [], repos: []}
