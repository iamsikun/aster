id: recsys-dynamics
name: Recommendation and user dynamics
bucket: active
priority: high
description: >
  Recommender systems where user preferences evolve in response to recommendations:
  preference dynamics, fatigue and satiation, world models of users, long-term policy
  evaluation, and exploration under feedback loops.
questions:
  - How should a recommender model preference evolution, fatigue, or satiation, and how can those dynamics be identified from logged data?
  - How can we evaluate the long-term effect of a recommendation policy when short-term engagement metrics mislead?
  - When do learned user world models / simulators support reliable off-policy evaluation and exploration?
keywords:
  - preference dynamics
  - user fatigue
  - satiation
  - habit formation
  - long-term value
  - surrogate outcomes
  - off-policy evaluation
  - counterfactual evaluation recommender
  - user simulator
  - world model recommendation
  - reinforcement learning recommender
  - exploration in recommendation
  - feedback loops
  - filter bubbles
  - interference in marketplace experiments
recognize:
  - long-term treatment effects estimated with short-term surrogates
  - dynamic discrete choice or structural models of consumption with state dependence
  - LLM-based user simulators for evaluating recommendation policies
  - Markov decision process formulations of user engagement
  - experimentation designs (switchback, cluster) for platforms with carryover effects
seeds: []      # TODO
negatives: []  # TODO: e.g. architecture-only papers improving static click-through prediction
known: []      # TODO
watch: {authors: [], labs: [], venues: [], repos: []}
