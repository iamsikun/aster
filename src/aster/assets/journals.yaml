# Journal registry: every journal Aster can follow through Crossref.
#
# A field lists the journals it follows by `id` (see fields.yaml). Add a journal in your
# config under `journals:` with the same keys. Every ISSN here was checked against
# https://api.crossref.org/journals/<issn>; Crossref is queried with all of them.
# (JMLR and TMLR register no DOIs with Crossref; JMLR is followed through its feed.)

