# Built-in defaults. Override any key in <data-dir>/lark.yaml (deep-merged).

timezone: America/Chicago

# Attention allocation across profile buckets (active projects / broader methods / exploration).
attention:
  active: 0.60
  methods: 0.25
  exploration: 0.15

limits:
  briefing_items: 8          # upper bound; fewer (or zero) is fine
  screen_per_day: 1000       # LLM abstract screenings
  candidates_per_day: 1500   # retrieval union cap before LLM screening
  focused_reads_per_day: 20
  analyses_per_day: 3
  audit_fraction: 0.05       # share of exclusions re-screened as audit samples
  exploration_sample: 10     # random unmatched items added to the candidate pool daily
  deep_read_max_pages: 80

budget:
  monthly_cash_usd: 10.0     # Gemini developer credit; paid fallback stays off at 0
  daily_cash_usd: 0.50
  paid_fallback_usd: 0.0

# Concrete ways to reach a model. Workers: gemini_api | claude_code | codex | openai_compat | fake.
# billing: subscription | api_credit | api_paid | local | none
# daily_calls caps capacity use on subscription routes (no reliable quota counter exists).
routes:
  gemini_flash:
    worker: gemini_api
    model: gemini-flash-latest
    billing: api_credit
    daily_calls: 1400
    price: {input_per_m: 0.30, output_per_m: 2.50}
  claude_haiku:
    worker: claude_code
    model: claude-haiku-5-5
    billing: subscription
    daily_calls: 25
  claude_sonnet:
    worker: claude_code
    model: claude-sonnet-5-5
    billing: subscription
    daily_calls: 5
  codex_luna:
    worker: codex
    model: gpt-6-luna
    billing: subscription
    daily_calls: 25
  codex_sol:
    worker: codex
    model: gpt-6.1-sol
    billing: subscription
    daily_calls: 5
  local_gemma:
    worker: openai_compat
    model: gemma4:12b
    base_url: http://localhost:11434/v1
    billing: local
    tag: gpu
  fake:
    worker: fake
    model: fake-1
    billing: none

# Application roles -> ordered route preferences. `strategy: alternate` spreads jobs across
# the listed routes (used to compare readers); `fallback` tries them in order.
roles:
  screener: {routes: [gemini_flash, claude_haiku], strategy: fallback}
  reader: {routes: [claude_haiku, codex_luna], strategy: alternate}
  analyst: {routes: [codex_sol, claude_sonnet], strategy: fallback}
  composer: {routes: [claude_haiku, codex_luna], strategy: fallback}
  local_screener: {routes: [local_gemma], strategy: fallback}
  local_reader: {routes: [local_gemma], strategy: fallback}

sources:
  arxiv:
    enabled: true
    categories: [stat.ML, stat.ME, stat.TH, econ.EM, econ.TH, cs.LG, cs.AI, cs.IR, q-fin.ST, q-fin.PM, math.OC]
    reconcile_days: 7        # OAI-PMH reconciliation window, run weekly
  crossref:
    enabled: true
    overlap_days: 3          # re-query this many days before the last checkpoint
  openalex:
    enabled: true
    overlap_days: 3
  nber:
    enabled: true
  nep:
    enabled: true
    reports: [nep-ecm, nep-big, nep-cmp, nep-fmk, nep-ore, nep-mkt]
  openreview:
    enabled: true
    venues: []               # e.g. ICLR.cc/2027/Conference
  ssrn_alerts:
    enabled: true
    imap_host: imap.gmail.com
    mailbox: ssrn            # Gmail label that SSRN alert emails are filtered into
  releases:
    enabled: true

delivery:
  channels: [email, archive]
  email:
    smtp_host: smtp.gmail.com
    smtp_port: 465
    subject_prefix: "[Lark]"
  archive:
    dir: briefings

feedback:
  repo: iamsikun/lark-data
