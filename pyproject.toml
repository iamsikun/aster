[project]
name = "aster-scout"
version = "0.2.1"
description = "An agent skill and CLI that finds what is new and what is being discussed in your research fields."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Sikun Xu" }]
keywords = ["agent-skill", "research", "arxiv", "ssrn", "papers", "claude-code", "codex"]
dependencies = [
    "feedparser>=6.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
    "requests>=2.32",
    "tenacity>=9.0",
]

[project.urls]
Homepage = "https://github.com/iamsikun/aster"
Repository = "https://github.com/iamsikun/aster"
Changelog = "https://github.com/iamsikun/aster/blob/main/CHANGELOG.md"
Issues = "https://github.com/iamsikun/aster/issues"

[project.scripts]
aster = "aster.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aster"]

[tool.hatch.build.targets.wheel.force-include]
"skills/aster" = "aster/skill"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "skills", "evals", "scripts", "install.sh", ".claude-plugin", "README.md", "CHANGELOG.md", "LICENSE", "AGENTS.md"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
